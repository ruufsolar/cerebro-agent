version: 1
last_reviewed: 2026-08-28
owner: finops
purpose: payment identification only

candidate_defaults:
  debtor_type: client
  recipient: ruuf
  cancelled: false
  positive_outstanding_balance: true
  installation_relevant: true
  preferred_currency: CLP
  supported_currencies: [CLP, USD, CLF]
  outstanding_formula: account_receivable_amount - payments - losses

pii_allowed_for_internal_identification:
  - rut
  - bank_account
  - phone
  - email
  - address

relations:
  - name: user
    reason: customer identity and relationships
  - name: personal_details
    reason: legal name and RUT matching
  - name: contact_info
    reason: phone and email correlation
  - name: booking
    reason: customer/order linkage and CRM orderId
  - name: order
    reason: commercial order context
  - name: quote
    reason: quoted sale and amount context
  - name: house
    reason: installation address matching against glosa
  - name: commune
    reason: normalize installation geography
  - name: sale
    reason: customer and payment-stage context
  - name: solar_system_installation
    reason: installation relevance/status
  - name: account_receivable
    reason: receivable amount, currency, parties, status, and due state
  - name: account_receivable_payment
    reason: registered abonos used in outstanding balance
  - name: account_receivable_loss
    reason: recognized losses used in outstanding balance
  - name: account_receivable_installment
    reason: installment/payment-stage context
  - name: account_receivable_installment_type
    reason: human-readable installment description
  - name: vambe_message
    reason: WhatsApp payment context and receipt mentions

explicitly_unavailable:
  - source: generic_pagos_mailbox
    detail: pagos@ruuf.solar has no general searchable storage contract yet
  - source: historical_vambe_attachment_bytes
    detail: received Vambe attachment URL is not generally persisted

query_limits:
  statement_timeout_seconds: 15
  max_rows: 200
  max_connections: 5
  statements: [SELECT, WITH]
  forbid:
    - multiple_statements
    - ddl
    - dml
    - procedures
    - select_for_update
    - copy
    - unallowlisted_relations
