# Installed at /etc/cerebro-agent/compose.yml on the approved production VM.
# /etc/cerebro-agent/env         -> container CEREBRO_* settings/secrets
# /etc/cerebro-agent/compose.env -> interpolation only: registry, image tag, DB password,
#                                   public hostname, and COMPOSE_PROFILES

name: cerebro-agent

x-logging: &capped-logs
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"

services:
  web:
    <<: *capped-logs
    image: ${CEREBRO_IMAGE_REPOSITORY:-cerebro-agent}:${IMAGE_TAG:-main}
    mem_limit: ${CEREBRO_WEB_MEM:-512m}
    command: >
      sh -c "cd /app/api && alembic upgrade head
      && python -m cerebro.jobs.schema
      && exec python -m cerebro.web"
    env_file: ${CEREBRO_ENV_FILE:-/etc/cerebro-agent/env}
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  control-worker:
    <<: *capped-logs
    image: ${CEREBRO_IMAGE_REPOSITORY:-cerebro-agent}:${IMAGE_TAG:-main}
    mem_limit: ${CEREBRO_CONTROL_WORKER_MEM:-512m}
    command: python -m cerebro.worker --role control
    env_file: ${CEREBRO_ENV_FILE:-/etc/cerebro-agent/env}
    depends_on:
      web:
        condition: service_healthy
    stop_grace_period: 240s
    restart: unless-stopped

  agent-worker:
    <<: *capped-logs
    image: ${CEREBRO_IMAGE_REPOSITORY:-cerebro-agent}:${IMAGE_TAG:-main}
    mem_limit: ${CEREBRO_AGENT_WORKER_MEM:-1536m}
    command: python -m cerebro.worker --role agent
    env_file: ${CEREBRO_ENV_FILE:-/etc/cerebro-agent/env}
    depends_on:
      web:
        condition: service_healthy
    stop_grace_period: 240s
    restart: unless-stopped

  slack:
    <<: *capped-logs
    image: ${CEREBRO_IMAGE_REPOSITORY:-cerebro-agent}:${IMAGE_TAG:-main}
    mem_limit: ${CEREBRO_SLACK_MEM:-384m}
    command: python -m cerebro.slack.socket
    env_file: ${CEREBRO_ENV_FILE:-/etc/cerebro-agent/env}
    depends_on:
      web:
        condition: service_healthy
    stop_grace_period: 240s
    restart: unless-stopped

  # The only service with a public listener, and only when the VM was seeded with a public
  # hostname: without it COMPOSE_PROFILES stays empty and this service is not part of the
  # project at all. Caddy terminates TLS, renews the certificate on its own, and forwards
  # exactly one method and path to web; see deploy/Caddyfile.
  caddy:
    <<: *capped-logs
    profiles: ["ingress"]
    image: caddy:2
    mem_limit: ${CEREBRO_CADDY_MEM:-256m}
    # Compose interpolates every service, including ones no active profile selects, so these
    # cannot be `:?` required variables without breaking a private deployment. Empty is the
    # safe failure: the Caddyfile has no site address, Caddy refuses the config, and the
    # container exits instead of listening on something nobody meant to publish.
    environment:
      CEREBRO_PUBLIC_HOSTNAME: ${CEREBRO_PUBLIC_HOSTNAME:-}
      CEREBRO_ACME_EMAIL: ${CEREBRO_ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/cerebro-agent/Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued certificates and the ACME account key. Docker's data-root is on the managed
      # data disk, so a container replacement never re-issues and never hits a rate limit.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  db:
    <<: *capped-logs
    image: postgres:18
    mem_limit: ${CEREBRO_DB_MEM:-1024m}
    environment:
      POSTGRES_USER: cerebro
      POSTGRES_PASSWORD: ${CEREBRO_DB_PASSWORD:?set CEREBRO_DB_PASSWORD in /etc/cerebro-agent/compose.env}
      POSTGRES_DB: cerebro
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cerebro -d cerebro"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  caddy-config:
  caddy-data:
  pgdata:
