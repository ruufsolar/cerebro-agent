name: cerebro-agent-local

services:
  web:
    build:
      context: ..
    command: >
      sh -c "cd /app/api && alembic upgrade head
      && python -m cerebro.jobs.schema
      && exec python -m cerebro.web"
    env_file:
      - path: ../.env
        required: false
    environment:
      CEREBRO_DATABASE_URL: postgresql://cerebro:local-dev-only@db:5432/cerebro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  control-worker:
    build:
      context: ..
    command: python -m cerebro.worker --role control
    env_file:
      - path: ../.env
        required: false
    environment:
      CEREBRO_DATABASE_URL: postgresql://cerebro:local-dev-only@db:5432/cerebro
    depends_on:
      web:
        condition: service_healthy
    stop_grace_period: 240s

  agent-worker:
    build:
      context: ..
    command: python -m cerebro.worker --role agent
    env_file:
      - path: ../.env
        required: false
    environment:
      CEREBRO_DATABASE_URL: postgresql://cerebro:local-dev-only@db:5432/cerebro
    depends_on:
      web:
        condition: service_healthy
    stop_grace_period: 240s

  slack:
    profiles: ["slack"]
    build:
      context: ..
    command: python -m cerebro.slack.socket
    env_file:
      - path: ../.env
        required: false
    environment:
      CEREBRO_DATABASE_URL: postgresql://cerebro:local-dev-only@db:5432/cerebro
    depends_on:
      web:
        condition: service_healthy
    stop_grace_period: 240s

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: cerebro
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: cerebro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cerebro -d cerebro"]
      interval: 5s
      timeout: 5s
      retries: 10

  replica:
    profiles: ["replica"]
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-fixture-only
      POSTGRES_DB: monolith_fixture
    ports:
      - "5433:5432"
    volumes:
      - replica-pgdata:/var/lib/postgresql
      - ../api/tests/fixtures/monolith_replica.sql:/docker-entrypoint-initdb.d/001-monolith.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monolith_fixture"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  replica-pgdata:
