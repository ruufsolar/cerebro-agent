name: Publish image

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Federated credential: the workflow proves its identity with a short-lived OIDC
      # token, so no registry or Azure secret is stored in this repository. The values
      # below are non-secret identifiers published by `terraform output github_actions_variables`.
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CI_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Log in to the container registry
        run: az acr login --name ${{ vars.AZURE_REGISTRY_NAME }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.AZURE_REGISTRY_LOGIN_SERVER }}/cerebro-agent:main
            ${{ vars.AZURE_REGISTRY_LOGIN_SERVER }}/cerebro-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
