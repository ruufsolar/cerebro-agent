display_information:
  name: cerebro
  description: Ratón megalomaniaco, altamente inteligente, y experto en pagos. Actualmente con contrato indefinido trabajando para FinOps.
  background_color: "#233d63"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: cerebro
    always_online: true
oauth_config:
  scopes:
    bot:
      - files:write
      - app_mentions:read
      - assistant:write
      - channels:history
      - channels:join
      - channels:read
      - chat:write
      - files:read
      - groups:history
      - im:history
      - im:read
      - im:write
      - lists:read
      - lists:write
      - reactions:read
      - reactions:write
      - users:read
  pkce_enabled: false
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - assistant_thread_context_changed
      - assistant_thread_started
      - message.channels
      - message.groups
      - message.im
      - reaction_added
      - reaction_removed
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
  is_mcp_enabled: false
